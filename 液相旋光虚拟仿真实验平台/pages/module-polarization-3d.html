<style>
/* 面板内步骤列表样式 */
.step-item {
    display:flex; align-items:center; gap:8px; padding:7px 10px; margin-bottom:3px;
    border-radius:6px; font-size:12.5px;
    color:rgba(255,255,255,0.6);
    transition:all 0.25s ease; cursor:default;
    text-shadow:0 1px 3px rgba(0,0,0,0.4);
}
.step-item.step-active {
    background:rgba(59,130,246,0.15); color:#93C5FD; font-weight:700;
    border-left:3px solid #60A5FA;
}
.step-item.step-done {
    color:rgba(134,239,172,0.8);
}
.step-item.step-done .step-num {
    background:rgba(134,239,172,0.15); color:#86EFAC; border-color:rgba(134,239,172,0.25);
}
.step-num {
    width:20px; height:20px; border-radius:50%;
    background:rgba(148,163,184,0.15); border:1px solid rgba(255,255,255,0.2);
    display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:800; flex-shrink:0;
    color:rgba(255,255,255,0.7);
}

/* 悬浮字幕基础样式（JS动态创建的元素使用此类） */
.spatial-tooltip {
    position:absolute; transform:translate(-50%,-100%);
    background:rgba(255,255,255,0.88);
    border:1px solid rgba(148,163,184,0.25); border-radius:8px;
    padding:8px 14px; color:#1E293B; font-size:12px; font-weight:600;
    white-space:nowrap; pointer-events:none;
    box-shadow:0 4px 16px rgba(0,0,0,0.08);
    animation:tooltip-pulse 2s ease-in-out infinite;
}
.spatial-tooltip.warning {
    border-color:rgba(255,159,67,0.5); color:#FF9F43;
    box-shadow:0 0 12px rgba(255,159,67,0.2);
}
.spatial-tooltip.error {
    border-color:rgba(255,107,107,0.5); color:#FF6B6B;
    box-shadow:0 0 12px rgba(255,107,107,0.2);
    animation:bubble-shake 0.4s ease-in-out;
}
.spatial-tooltip.success {
    border-color:rgba(0,255,135,0.5); color:#2ED573;
    box-shadow:0 0 12px rgba(0,255,135,0.2);
}
@keyframes tooltip-pulse { 0%,100%{opacity:1;} 50%{opacity:0.75;} }
@keyframes bubble-shake { 0%,100%{transform:translate(-50%,-100%) translateX(0);} 25%{transform:translate(-50%,-100%) translateX(-4px);} 75%{transform:translate(-50%,-100%) translateX(4px);} }

/* 错误气泡 */
.error-bubble {
    position:relative; background:rgba(255,107,107,0.12); border:1px solid rgba(255,107,107,0.3);
    border-radius:10px; padding:12px 18px; color:#FF6B6B; font-size:13px; font-weight:600;
    max-width:420px; animation:bubble-in 0.3s ease-out; pointer-events:auto;
    line-height:1.5;
}
.error-bubble.success-bubble {
    background:rgba(0,255,135,0.08); border-color:rgba(0,255,135,0.25); color:#2ED573;
}
@keyframes bubble-in { from{opacity:0; transform:translateY(-10px) scale(0.95);} to{opacity:1; transform:translateY(0) scale(1);} }

/* 操作状态指示器动画 */
@keyframes indicatorSlideIn {
    from { opacity:0; transform:translateX(-50%) translateY(20px); }
    to { opacity:1; transform:translateX(-50%) translateY(0); }
}

/* 目镜2D圆形手轮盘 */
.eyepiece-dial-container {
    display:flex; flex-direction:column; align-items:center; gap:12px;
    margin-top:16px;
}
.eyepiece-dial-wheel {
    width:140px; height:140px; border-radius:50%;
    background:linear-gradient(135deg, rgba(255,255,255,0.95), rgba(248,250,252,0.9));
    border:2px solid rgba(59,130,246,0.35);
    position:relative; cursor:pointer; user-select:none;
    box-shadow:
        0 4px 20px rgba(0,0,0,0.08),
        inset 0 0 30px rgba(148,163,184,0.1);
    transition:border-color 0.3s, box-shadow 0.3s;
}
.eyepiece-dial-wheel:hover {
    border-color:#3B82F6;
    box-shadow:0 6px 28px rgba(59,130,246,0.15), inset 0 0 30px rgba(148,163,184,0.1);
}
/* 手轮刻度线（CSS生成） */
.eyepiece-dial-ticks {
    position:absolute; top:50%; left:50%; width:120px; height:120px;
    transform:translate(-50%,-50%);
}
.eyepiece-dial-tick {
    position:absolute; width:2px; height:8px;
    background:rgba(71,85,105,0.35); border-radius:1px;
    top:0; left:50%; transform-origin:center 60px;
}
/* 手轮中心指针 */
.eyepiece-dial-pointer {
    position:absolute; top:50%; left:50%;
    width:4px; height:55px;
    background:linear-gradient(to top, #3B82F6, transparent);
    transform-origin:bottom center;
    transform:translate(-50%,-100%);
    border-radius:2px;
    box-shadow:0 0 10px rgba(59,130,246,0.6);
    transition:transform 0.15s ease-out;
}
/* 手轮中心圆心 */
.eyepiece-dial-center {
    position:absolute; top:50%; left:50%;
    width:18px; height:18px; border-radius:50%;
    background:radial-gradient(circle, #3B82F6, #06B6D4);
    transform:translate(-50%,-50%);
    box-shadow:0 0 12px rgba(59,130,246,0.5);
}
/* 键盘提示条 */
.keyboard-hint-bar {
    display:flex; gap:12px; align-items:center;
    padding:8px 16px; border-radius:20px;
    background:rgba(139,92,246,0.06); border:1px solid rgba(139,92,246,0.15);
}
.keyboard-hint-key {
    display:inline-flex; align-items:center; justify-content:center;
    min-width:26px; height:26px; padding:0 6px;
    border-radius:6px; border:1px solid rgba(139,92,246,0.25);
    background:rgba(139,92,246,0.08); color:#8B5CF6;
    font-size:11px; font-weight:700; font-family:'Consolas','Monaco',monospace;

<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <script src="./pages-demo.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>波动光学虚拟仿真综合实验平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #2979ff;
            --primary-dark: #1565c0;
            --accent-color: #ff5722;
            --text-dark: #263238;
            --text-light: #78909c;
            --background: #e9edf6;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', 'SimHei', sans-serif;
            line-height: 1.6;
            color: var(--text-dark);
            background-color: var(--background);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 渐变背景 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, #e6eeff 0%, #d9e3f7 50%, #ccdcff 100%);
            z-index: -2;
        }

        /* 添加深色背景层 */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 30% 20%, rgba(78, 106, 240, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 70% 60%, rgba(205, 61, 115, 0.05) 0%, transparent 40%);
            z-index: -1;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* 顶部导航 */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            text-decoration: none;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary-color);
            position: relative;
            padding-left: 45px;
        }

        .logo::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid rgba(73, 125, 255, 0.6);
            box-shadow: 0 0 0 6px rgba(73, 125, 255, 0.1);
            background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 30%, rgba(73, 125, 255, 0.2) 70%);
        }

        .logo::after {
            content: '';
            position: absolute;
            left: 9px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #4e6af0, #cd3d73, #e64a47, #4e6af0);
            opacity: 0.8;
            animation: rotate 6s linear infinite;
        }

        @keyframes rotate {
            0% {
                transform: translateY(-50%) rotate(0deg);
            }

            100% {
                transform: translateY(-50%) rotate(360deg);
            }
        }

        .logo span {
            margin-left: 8px;
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .api-link {
            text-decoration: none;
            color: var(--text-dark);
            border: 1px solid rgba(0, 0, 0, 0.1);
            padding: 6px 16px;
            border-radius: 24px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
        }

        .api-link:hover {
            background-color: rgba(0, 0, 0, 0.05);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .api-link svg {
            margin-left: 8px;
        }

        .lang-switch {
            color: var(--text-dark);
            text-decoration: none;
            font-size: 0.9rem;
            position: relative;
            padding: 6px 12px;
            transition: all 0.3s ease;
        }

        .lang-switch::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0;
            height: 2px;
            background: var(--primary-color);
            transition: width 0.3s ease;
        }

        .lang-switch:hover::after {
            width: 100%;
        }

        /* 主内容区 */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            background: linear-gradient(180deg, #f3f0fc 0%, #ebe6fa 45%, #e4ddf8 100%);
            padding-top: 0;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.55) 0%, transparent 45%),
                radial-gradient(circle at 85% 15%, rgba(214, 200, 248, 0.5) 0%, transparent 40%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.35) 0%, transparent 60%);
            z-index: 0;
            pointer-events: none;
        }

        /* 底部中央光球：紫色 + 粉色动态融合（参考样式） */
        .hero::after {
            content: '';
            position: absolute;
            bottom: -80vh;
            left: 50%;
            width: 120vh;
            height: 120vh;
            border-radius: 50%;
            /* 白色穹顶底色：外圈白、内部留出供彩色透出的透明区 */
            background: radial-gradient(circle at 50% 50%,
                    rgba(255, 255, 255, 0) 0%,
                    rgba(255, 255, 255, 0) 52%,
                    rgba(250, 247, 255, 0.55) 68%,
                    rgba(253, 251, 255, 0.95) 80%,
                    rgba(255, 255, 255, 0) 90%);
            filter: blur(10px);
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            transform: translateX(-50%);
            transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
            animation: orb-breathe 9s ease-in-out infinite alternate;
        }

        /* 彩色流动层：紫 + 粉两团光晕缓慢移动融合 */
        .orb-color {
            content: '';
            position: absolute;
            bottom: -80vh;
            left: 50%;
            width: 120vh;
            height: 120vh;
            border-radius: 50%;
            background:
                radial-gradient(circle at 38% 62%, rgba(232, 150, 224, 0.9) 0%, rgba(232, 150, 224, 0) 42%),
                radial-gradient(circle at 60% 58%, rgba(150, 110, 230, 0.88) 0%, rgba(150, 110, 230, 0) 46%),
                radial-gradient(circle at 50% 78%, rgba(244, 168, 214, 0.8) 0%, rgba(244, 168, 214, 0) 40%),
                radial-gradient(circle at 50% 50%, rgba(196, 160, 240, 0.55) 0%, rgba(196, 160, 240, 0) 60%);
            /* 用遮罩把彩色限制在球内，并向边缘淡出为白 */
            -webkit-mask: radial-gradient(circle at 50% 50%, #000 0%, #000 50%, rgba(0, 0, 0, 0) 74%);
            mask: radial-gradient(circle at 50% 50%, #000 0%, #000 50%, rgba(0, 0, 0, 0) 74%);
            filter: blur(26px);
            z-index: 0;
            pointer-events: none;
            transform: translateX(-50%);
            transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
            animation: orb-color-flow 12s ease-in-out infinite alternate;
        }

        /* 底部光球悬停感应区 */
        .hero-orb-hit {
            position: absolute;
            left: 50%;
            bottom: 0;
            width: min(100vw, 110vh);
            height: 52vh;
            transform: translateX(-50%);
            z-index: 0;
            cursor: pointer;
            background: transparent;
        }

        /* 鼠标悬停光球时放大 */
        .hero.orb-hover::after {
            animation-play-state: paused;
            transform: translateX(-50%) scale(1.14);
        }

        .hero.orb-hover .orb-color {
            animation-play-state: paused;
            transform: translateX(-50%) scale(1.18);
        }

        @keyframes orb-breathe {
            0% {
                transform: translateX(-50%) scale(1);
                opacity: 0.92;
            }

            100% {
                transform: translateX(-50%) scale(1.045);
                opacity: 1;
            }
        }

        /* 紫粉两色缓慢错位流动，营造动态融合感 */
        @keyframes orb-color-flow {
            0% {
                background-position:
                    -4% 2%,
                    3% -2%,
                    0 3%,
                    0 0;
                transform: translateX(-50%) scale(1);
            }

            50% {
                background-position:
                    5% -3%,
                    -4% 2%,
                    2% -2%,
                    0 0;
            }

            100% {
                background-position:
                    -2% 4%,
                    4% 1%,
                    -2% 2%,
                    0 0;
                transform: translateX(-50%) scale(1.04);
            }
        }

        /* 隐藏旧版背景装饰，统一为浅紫光球风格 */
        .bg-decoration,
        .newton-ring-bg,
        .grid-lines,
        .texture-overlay {
            display: none;
        }

        /* ===== 封面装饰元素（参考图风格：点阵、电路线、小方块） ===== */
        .hero-deco {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        /* 电路风格折线（小方块嵌在折线端点上，保证对齐） */
        .deco-line {
            position: absolute;
            border: 1.5px solid rgba(150, 125, 215, 0.38);
            animation: deco-fade 7s ease-in-out infinite alternate;
        }

        /* 左上：L 形（上边 + 左边），开口朝右下 */
        .deco-line.l1 {
            top: 18%;
            left: 6%;
            width: 170px;
            height: 110px;
            border-right: none;
            border-bottom: none;
            border-top-left-radius: 14px;
        }

        /* 右上：L 形（上边 + 右边），与左上对称 */
        .deco-line.l2 {
            top: 18%;
            right: 6%;
            width: 170px;
            height: 110px;
            border-left: none;
            border-bottom: none;
            border-top-right-radius: 14px;
            animation-delay: 1.5s;
        }

        /* 右下：L 形（下边 + 右边） */
        .deco-line.l3 {
            top: 56%;
            right: 9%;
            width: 130px;
            height: 90px;
            border-left: none;
            border-top: none;
            border-bottom-right-radius: 14px;
            animation-delay: 3s;
        }

        /* 左下：L 形（下边 + 左边），与右下对称 */
        .deco-line.l4 {
            top: 56%;
            left: 9%;
            width: 130px;
            height: 90px;
            border-right: none;
            border-top: none;
            border-bottom-left-radius: 14px;
            animation-delay: 4.5s;
        }

        /* 端点小方块：作为折线子元素，自动贴在线条两个开口端 */
        .deco-line .deco-square {
            position: absolute;
            width: 13px;
            height: 13px;
            background: rgba(255, 255, 255, 0.95);
            border: 1.5px solid rgba(150, 125, 215, 0.5);
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(120, 95, 200, 0.18);
            animation: deco-pulse 5s ease-in-out infinite;
        }

        /* l1：端点在上边右端、左边下端 */
        .deco-line.l1 .deco-square:nth-child(1) {
            top: -7px;
            right: -7px;
        }

        .deco-line.l1 .deco-square:nth-child(2) {
            bottom: -7px;
            left: -7px;
            animation-delay: 1s;
        }

        /* l2：端点在上边左端、右边下端 */
        .deco-line.l2 .deco-square:nth-child(1) {
            top: -7px;
            left: -7px;
        }

        .deco-line.l2 .deco-square:nth-child(2) {
            bottom: -7px;
            right: -7px;
            animation-delay: 2s;
        }

        /* l3：端点在下边左端、右边上端 */
        .deco-line.l3 .deco-square:nth-child(1) {
            bottom: -7px;
            left: -7px;
        }

        .deco-line.l3 .deco-square:nth-child(2) {
            top: -7px;
            right: -7px;
            animation-delay: 1.5s;
        }

        /* l4：端点在下边右端、左边上端 */
        .deco-line.l4 .deco-square:nth-child(1) {
            bottom: -7px;
            right: -7px;
        }

        .deco-line.l4 .deco-square:nth-child(2) {
            top: -7px;
            left: -7px;
            animation-delay: 2.5s;
        }

        /* 漂浮光斑 */
        .deco-glow {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(190, 160, 245, 0.35) 0%, transparent 70%);
            animation: deco-drift 14s ease-in-out infinite alternate;
        }

        .deco-glow.g1 {
            width: 220px;
            height: 220px;
            top: 20%;
            left: -60px;
        }

        .deco-glow.g2 {
            width: 260px;
            height: 260px;
            top: 8%;
            right: -80px;
            animation-delay: 4s;
        }

        @keyframes deco-fade {
            0% {
                opacity: 0.35;
            }

            100% {
                opacity: 0.8;
            }
        }

        @keyframes deco-pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.65;
            }

            50% {
                transform: scale(1.18);
                opacity: 1;
            }
        }

        @keyframes deco-drift {
            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(30px, 24px);
            }
        }

        /* 背景装饰元素 */
        .bg-decoration {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            opacity: 0.6;
        }

        .particle {
            position: absolute;
            background-color: rgba(73, 125, 255, 0.15);
            border-radius: 50%;
            animation: float-particle 15s ease-in-out infinite alternate;
            box-shadow: 0 0 15px rgba(73, 125, 255, 0.1);
        }

        .particle:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 15%;
            left: 10%;
            animation-duration: 18s;
        }

        .particle:nth-child(2) {
            width: 60px;
            height: 60px;
            top: 25%;
            left: 85%;
            animation-duration: 22s;
            animation-delay: 2s;
        }

        .particle:nth-child(3) {
            width: 40px;
            height: 40px;
            bottom: 20%;
            left: 20%;
            animation-duration: 15s;
            animation-delay: 1s;
        }

        .particle:nth-child(4) {
            width: 70px;
            height: 70px;
            bottom: 30%;
            right: 15%;
            animation-duration: 20s;
            animation-delay: 3s;
        }

        @keyframes float-particle {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0.3;
            }

            50% {
                transform: translateY(30px) translateX(20px);
                opacity: 0.6;
            }

            100% {
                transform: translateY(-20px) translateX(-15px);
                opacity: 0.3;
            }
        }

        .physics-symbol {
            position: absolute;
            color: rgba(73, 125, 255, 0.12);
            font-size: 2.5rem;
            font-family: 'Times New Roman', serif;
            font-style: italic;
            font-weight: bold;
            animation: fade-in-out 8s ease-in-out infinite alternate;
            text-shadow: 0 0 10px rgba(73, 125, 255, 0.1);
        }

        .physics-symbol:nth-child(1) {
            top: 18%;
            left: 25%;
            font-size: 4rem;
            transform: rotate(-15deg);
        }

        .physics-symbol:nth-child(2) {
            top: 65%;
            left: 75%;
            font-size: 3.5rem;
            transform: rotate(10deg);
        }

        .physics-symbol:nth-child(3) {
            top: 30%;
            right: 20%;
            font-size: 3rem;
            transform: rotate(-5deg);
        }

        .physics-symbol:nth-child(4) {
            bottom: 25%;
            left: 30%;
            font-size: 2.8rem;
            transform: rotate(8deg);
        }

        @keyframes fade-in-out {
            0% {
                opacity: 0.05;
                transform: rotate(-15deg) scale(0.9);
            }

            50% {
                opacity: 0.08;
                transform: rotate(-10deg) scale(1);
            }

            100% {
                opacity: 0.05;
                transform: rotate(-15deg) scale(0.9);
            }
        }

        .newton-ring-small {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(73, 125, 255, 0.15);
            animation: pulse-small 10s infinite alternate;
            box-shadow: 0 0 20px rgba(73, 125, 255, 0.1);
        }

        .newton-ring-small:nth-child(1) {
            width: 120px;
            height: 120px;
            top: 10%;
            left: 15%;
        }

        .newton-ring-small:nth-child(2) {
            width: 150px;
            height: 150px;
            bottom: 15%;
            left: 8%;
            animation-delay: 2s;
        }

        .newton-ring-small:nth-child(3) {
            width: 100px;
            height: 100px;
            top: 15%;
            right: 12%;
            animation-delay: 1s;
        }

        .newton-ring-small:nth-child(4) {
            width: 200px;
            height: 200px;
            bottom: 20%;
            right: 15%;
            animation-delay: 3s;
        }

        @keyframes pulse-small {
            0% {
                transform: scale(1);
                opacity: 0.05;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.1;
            }

            100% {
                transform: scale(1);
                opacity: 0.05;
            }
        }

        .grid-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(to right, rgba(73, 125, 255, 0.06) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(73, 125, 255, 0.06) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
        }

        .grid-lines::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(to right, rgba(73, 125, 255, 0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(73, 125, 255, 0.08) 1px, transparent 1px);
            background-size: 200px 200px;
            z-index: -1;
        }

        /* 背景牛顿环 */
        .newton-ring-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            opacity: 0.8;
            overflow: hidden;
        }

        /* 添加牛顿环图形 */
        .newton-rings {
            position: absolute;
            width: 800px;
            height: 800px;
            top: 50%;
            right: -100px;
            transform: translateY(-50%);
            opacity: 0.1;
            z-index: 0;
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(73, 125, 255, 0.5);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .ring:nth-child(1) {
            width: 700px;
            height: 700px;
            border-width: 2px;
            animation: pulse 8s infinite alternate;
        }

        .ring:nth-child(2) {
            width: 550px;
            height: 550px;
            border-width: 3px;
            animation: pulse 7s 0.5s infinite alternate;
        }

        .ring:nth-child(3) {
            width: 400px;
            height: 400px;
            border-width: 2px;
            animation: pulse 6s 1s infinite alternate;
        }

        .ring:nth-child(4) {
            width: 250px;
            height: 250px;
            border-width: 2px;
            animation: pulse 5s 1.5s infinite alternate;
        }

        .ring:nth-child(5) {
            width: 150px;
            height: 150px;
            border-width: 1px;
            animation: pulse 4s 2s infinite alternate;
        }

        @keyframes pulse {
            0% {
                opacity: 0.3;
                transform: translate(-50%, -50%) scale(1);
            }

            100% {
                opacity: 0.7;
                transform: translate(-50%, -50%) scale(1.05);
            }
        }

        .wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 300px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%232979ff" fill-opacity="0.05" d="M0,96L48,106.7C96,117,192,139,288,144C384,149,480,139,576,122.7C672,107,768,85,864,90.7C960,96,1056,128,1152,144C1248,160,1344,160,1392,160L1440,160L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>') repeat-x;
            background-size: 1440px 320px;
            animation: wave-animation 30s linear infinite;
        }

        @keyframes wave-animation {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-1440px);
            }
        }

        .wave:nth-child(2) {
            bottom: -10px;
            opacity: 0.5;
            animation: wave-animation 20s linear infinite reverse;
        }

        .hero-content {
            max-width: 1200px;
            z-index: 1;
            position: relative;
            text-align: center;
            padding: 0 20px;
            transform: translateY(-20px);
        }

        .main-title {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.2;
            background: linear-gradient(45deg, #4e6af0, #cd3d73, #e64a47);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
            animation: fadeUp 1s ease-out;
            white-space: nowrap;
        }

        .subtitle {
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 2rem;
            color: var(--text-dark);
            animation: fadeUp 1s 0.2s ease-out both;
        }

        .description {
            font-size: 1.25rem;
            color: var(--text-light);
            margin-bottom: 1.5rem;
            line-height: 1.8;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;

                        <rect x="32" y="14" width="6" height="20" rx="1" stroke="currentColor" stroke-width="2"/>
                        <path d="M16 24h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M22 20l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <ellipse cx="24" cy="36" rx="8" ry="3" stroke="currentColor" stroke-width="2" opacity=".5"/>

                    <h3>偏振光与蔗糖旋光实验</h3>

    <div class="login-modal-overlay" id="loginModalOverlay">
        <div class="login-modal">
            <div class="login-modal-header">
                <h2>选择登录身份</h2>
                <button class="login-close-btn" id="closeLoginModal">&times;</button>
            </div>
            <div class="login-role-selector">
                <div class="role-card" id="studentRoleCard">
                    <div class="role-icon student-icon">
                        <img src="images/图7.png" alt="学生头像">
                    </div>
                    <h3>学生登录</h3>
                    <p>进入虚拟仿真实验平台</p>
                </div>
                <div class="role-card" id="teacherRoleCard">
                    <div class="role-icon teacher-icon">
                        <img src="images/图8.png" alt="教师头像">
                    </div>
                    <h3>教师登录</h3>
                    <p>进入教师管理端</p>
                </div>
            </div>
            <div class="login-form-container" id="loginFormContainer" style="display: none;">
                <div class="login-form-header">
                    <button class="back-btn" id="backToRoleSelect">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M19 12H5M12 19l-7-7 7-7" stroke="#666" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </button>
                    <h3 id="loginFormTitle">学生登录</h3>
                </div>
                <form class="login-form" id="loginForm">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input type="text" id="username" name="username" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label for="account">账号</label>
                        <input type="text" id="account" name="account" placeholder="请输入账号" required>
                    </div>
                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" name="password" placeholder="请输入密码" required>
                    </div>
                    <div class="form-error" id="formError"></div>
                    <button type="submit" class="login-submit-btn" id="loginSubmitBtn">登 录</button>
                </form>
            </div>

    <script>
        // 底部光球悬停放大
        (function () {
            const hero = document.querySelector('.hero');
            const orbHit = document.getElementById('heroOrbHit');
            if (!hero || !orbHit) return;

            orbHit.addEventListener('mouseenter', function () {
                hero.classList.add('orb-hover');
            });
            orbHit.addEventListener('mouseleave', function () {
                hero.classList.remove('orb-hover');
            });
        })();

        // ========== 登录功能 ==========
        const defaultAccounts = {
            student: {
                username: '学生',
                account: '123456',
                password: '88888888'
            },
            teacher: {
                username: '教师',
                account: '666666',
                password: '88888888'
            }
        };

        let currentLoginRole = null;

        /** 牛顿环子平台（与根目录衍射实验静态资源分离） */
        const NEWTON_RING_PLATFORM_URL = new URL('newton-ring/', document.baseURI).href;
        const LIQUID_OPTICAL_ROTATION_PLATFORM_URL = new URL('液相旋光虚拟仿真实验平台/', document.baseURI).href;

        function getSubPlatformBaseUrl() {
            const experiment = localStorage.getItem('selectedExperiment');
            if (experiment === 'newton-ring') return NEWTON_RING_PLATFORM_URL;
            if (experiment === 'sucrose-optical-rotation') return LIQUID_OPTICAL_ROTATION_PLATFORM_URL;
            return null;
        }

        function goToLiquidOpticalRotationPlatform() {
            window.location.href = `${LIQUID_OPTICAL_ROTATION_PLATFORM_URL}index.html`;
        }

        const loginModalOverlay = document.getElementById('loginModalOverlay');
        const experimentCards = document.querySelectorAll('.experiment-card');
        const closeLoginModal = document.getElementById('closeLoginModal');
        const studentRoleCard = document.getElementById('studentRoleCard');
        const teacherRoleCard = document.getElementById('teacherRoleCard');
        const loginFormContainer = document.getElementById('loginFormContainer');
        const loginRoleSelector = document.querySelector('.login-role-selector');
        const loginFormTitle = document.getElementById('loginFormTitle');
        const backToRoleSelect = document.getElementById('backToRoleSelect');
        const loginForm = document.getElementById('loginForm');
        const formError = document.getElementById('formError');

        function openLoginModal() {
            loginModalOverlay.classList.add('active');
            resetLoginForm();
        }

        // ========== Canvas 彩带粒子动画 ==========
        (function initRibbonCanvas() {
            const canvas = document.getElementById('ribbonCanvas');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            const ribbons = [];
            const colors = [
                '#55B7D8', '#48C9C0', '#70C98B', '#C3D94E',
                '#F0C34E', '#F29A5B', '#F07878', '#E989B4',
                '#A878D1', '#8176D8', '#579BE8', '#718BE8'
            ];
            let width = 0;
            let height = 0;
            let density = 1;
            let emissionUntil = 0;
            let lastFrame = performance.now();
            let lastEdgeTrigger = 0;

            function resizeCanvas() {
                const ratio = Math.min(window.devicePixelRatio || 1, 2);
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = Math.floor(width * ratio);
                canvas.height = Math.floor(height * ratio);
                canvas.style.width = `${width}px`;
                canvas.style.height = `${height}px`;
                ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
                density = width < 700 ? 0.58 : 1;
            }

            function random(min, max) {
                return min + Math.random() * (max - min);
            }

            function createRibbon(side) {
                const fromLeft = side === 'left';
                const ribbonWidth = random(20, 80);
                return {
                    x: fromLeft ? -ribbonWidth : width + ribbonWidth,
                    y: random(height * 0.18, height * 0.7),
                    width: ribbonWidth,
                    height: random(3, 9),
                    amplitude: random(5, 14),
                    frequency: random(0.055, 0.13),
                    phase: random(0, Math.PI * 2),
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vx: (fromLeft ? 1 : -1) * random(1.6, 4.4),
                    vy: random(-3.4, -0.4),
                    rotation: fromLeft ? random(-0.25, 0.15) : random(-0.15, 0.25),
                    angularVelocity: random(-0.018, 0.018),
                    gravity: random(0.055, 0.095),
                    airResistance: random(0.985, 0.997),
                    age: 0,
                    maxAge: random(420, 760),
                    alpha: random(0.58, 0.82)
                };
            }

            function emit(count = 1) {
                const amount = Math.ceil(count * density);
                for (let i = 0; i < amount; i += 1) {
                    ribbons.push(createRibbon(Math.random() < 0.5 ? 'left' : 'right'));
                }
            }

            function drawRibbon(ribbon) {
                ctx.save();
                ctx.translate(ribbon.x, ribbon.y);
                ctx.rotate(ribbon.rotation);
                ctx.globalAlpha = ribbon.alpha;

                const gradient = ctx.createLinearGradient(-ribbon.width / 2, 0, ribbon.width / 2, 0);
                gradient.addColorStop(0, `${ribbon.color}22`);
                gradient.addColorStop(0.18, ribbon.color);
                gradient.addColorStop(0.5, 'rgba(255,255,255,0.96)');
                gradient.addColorStop(0.78, ribbon.color);
                gradient.addColorStop(1, `${ribbon.color}33`);

                // 开放式正弦波线条，模拟附件中轻盈卷曲的彩带
                ctx.beginPath();
                const points = 30;
                for (let i = 0; i <= points; i += 1) {
                    const progress = i / points;
                    const x = -ribbon.width / 2 + ribbon.width * progress;
                    const wave = Math.sin(progress * Math.PI * 4.2 + ribbon.phase) * ribbon.amplitude
                        + Math.sin(progress * Math.PI * 8.5 + ribbon.phase * 0.7) * ribbon.amplitude * 0.22;
                    const y = wave + Math.sin(progress * Math.PI) * ribbon.height * 0.18;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.strokeStyle = gradient;
                ctx.lineWidth = Math.max(1.6, ribbon.height * 0.38);
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowColor = ribbon.color;
                ctx.shadowBlur = 7;
                ctx.stroke();
                ctx.shadowBlur = 0;

                // 中心高光，让彩带出现附件中类似的丝绸反光
                ctx.beginPath();
                for (let i = 7; i <= 23; i += 1) {
                    const progress = i / points;
                    const x = -ribbon.width / 2 + ribbon.width * progress;
                    const wave = Math.sin(progress * Math.PI * 4.2 + ribbon.phase) * ribbon.amplitude
                        + Math.sin(progress * Math.PI * 8.5 + ribbon.phase * 0.7) * ribbon.amplitude * 0.22;
                    const y = wave - ribbon.height * 0.18;
                    if (i === 7) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.strokeStyle = 'rgba(255,255,255,0.78)';
                ctx.lineWidth = Math.max(0.65, ribbon.height * 0.1);
                ctx.stroke();
                ctx.restore();
            }

            function updateRibbon(ribbon, delta) {
                ribbon.age += delta;
                ribbon.phase += 0.045 * delta;
                ribbon.rotation += ribbon.angularVelocity * delta;
                ribbon.vy += ribbon.gravity * delta;
                ribbon.vx *= Math.pow(ribbon.airResistance, delta);
                ribbon.vy *= Math.pow(ribbon.airResistance, delta);
                ribbon.x += ribbon.vx * delta;
                ribbon.y += ribbon.vy * delta;
                // 彩带越过底部后继续下落并淡出，不在屏幕底部停留或堆积
                if (ribbon.y > height + 30) ribbon.alpha -= 0.04 * delta;
                if (ribbon.age > ribbon.maxAge) ribbon.alpha -= 0.025 * delta;
            }

            function animate(now) {
                const delta = Math.min((now - lastFrame) / 16.67, 2);
                lastFrame = now;
                ctx.clearRect(0, 0, width, height);

                if (now < emissionUntil) emit(0.72);
                for (let i = ribbons.length - 1; i >= 0; i -= 1) {
                    updateRibbon(ribbons[i], delta);
                    drawRibbon(ribbons[i]);
                    if (ribbons[i].alpha <= 0 || ribbons[i].x < -180 || ribbons[i].x > width + 180) {
                        ribbons.splice(i, 1);
                    }
                }
                requestAnimationFrame(animate);
            }

            function triggerEmission() {
                const now = performance.now();
                if (now - lastEdgeTrigger < 500) return;
                lastEdgeTrigger = now;
                emissionUntil = now + 3000;
                emit(8);
            }

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('mousemove', (event) => {
                if (event.clientX <= 50 || event.clientX >= width - 50) triggerEmission();
            }, { passive: true });
            setTimeout(triggerEmission, 500);
            requestAnimationFrame(animate);
        })();

        function closeLoginModalFn() {
            loginModalOverlay.classList.remove('active');
            setTimeout(() => {
                resetLoginForm();
            }, 300);
        }

        function resetLoginForm() {
            loginRoleSelector.style.display = 'flex';
            loginFormContainer.style.display = 'none';
            loginForm.reset();
            formError.textContent = '';
            currentLoginRole = null;
        }

        function showLoginForm(role) {
            currentLoginRole = role;
            loginRoleSelector.style.display = 'none';
            loginFormContainer.style.display = 'block';
            loginFormTitle.textContent = role === 'student' ? '学生登录' : '教师登录';
            formError.textContent = '';
        }

        function validateLogin(username, account, password) {
            if (!currentLoginRole) return { success: false, message: '请选择登录身份' };

            const defaultAccount = defaultAccounts[currentLoginRole];

            const isTeacherAlias = currentLoginRole === 'teacher' && username === '老师';
            if ((username === defaultAccount.username || isTeacherAlias) &&
                account === defaultAccount.account &&
                password === defaultAccount.password) {
                return { success: true, role: currentLoginRole, isDefault: true };
            }

            return { success: false, message: '用户名、账号或密码错误', needApi: true };
        }

        function navigateAfterLogin(role, userPayload, authToken) {
            const experiment = localStorage.getItem('selectedExperiment');
            if (experiment === 'sucrose-optical-rotation') {
                goToLiquidOpticalRotationPlatform();
                return;
            }

            const subPlatformBase = getSubPlatformBaseUrl();

            if (subPlatformBase) {
                const page = role === 'teacher' ? 'teacher-dashboard.html' : 'theory.html';
                const url = new URL(page, subPlatformBase);
                if (userPayload) {
                    url.searchParams.set('bridgeUser', JSON.stringify(userPayload));
                }
                if (authToken) {
                    url.searchParams.set('bridgeToken', authToken);
                }
                window.location.href = url.toString();
                return;
            }

            const diffractionBase = new URL('./', document.baseURI).href;
            if (role === 'student') {
                window.location.href = `${diffractionBase}theory.html`;
            } else if (role === 'teacher') {
                window.location.href = `${diffractionBase}teacher-dashboard.html`;
            }
        }

        async function handleApiLogin(account, password) {
            const subPlatformBase = getSubPlatformBaseUrl();

            if (subPlatformBase) {
                try {
                    formError.textContent = '正在登录...';
                const apiRoot = `${window.location.origin}/api`;
                    const res = await fetch(`${apiRoot}/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ account, password })
                    });
                    const response = await res.json();

                    if (response.success) {
                        const user = response.data.user;
                        navigateAfterLogin(user.role, user, response.data.token);
                    } else {
                        formError.textContent = response.message || '登录失败';
                    }
                } catch (error) {
                    console.error('子平台 API 登录错误:', error);
                    formError.textContent = '无法连接后端服务，请确认服务已启动';
                }
                return;
            }

            try {
                if (!window.api || typeof window.api.login !== 'function') {
                    formError.textContent = '登录服务未加载，请通过 http://localhost:3000 访问平台';
                    return;
                }
                formError.textContent = '正在登录...';
                const response = await window.api.login(account, password);

                if (response.success) {
                    const user = response.data.user;
                    navigateAfterLogin(user.role, user, response.data.token);
                } else {
                    formError.textContent = response.message || '登录失败';
                }
            } catch (error) {
                console.error('API登录错误:', error);
                formError.textContent = error.message || '网络错误，请检查后端服务是否启动';
            }
        }

        function handleLogin(role, username, account) {
            const userData = {
                role: role,
                username: username,
                account: account,
                loginTime: new Date().toISOString()
            };
            localStorage.setItem('currentUser', JSON.stringify(userData));
            navigateAfterLogin(role, userData);
        }

        experimentCards.forEach((card) => {
            card.addEventListener('click', () => {
                localStorage.setItem('selectedExperiment', card.dataset.experiment);
                handleLogin('student', '访客', 'demo');
            });
        });
        closeLoginModal.addEventListener('click', closeLoginModalFn);

        loginModalOverlay.addEventListener('click', (e) => {
            if (e.target === loginModalOverlay) {
                closeLoginModalFn();
            }
        });

        function enterWithRole(role) {
            const defaultAccount = defaultAccounts[role];
            handleLogin(role, defaultAccount.username, defaultAccount.account);
        }

        studentRoleCard.addEventListener('click', () => enterWithRole('student'));
        teacherRoleCard.addEventListener('click', () => enterWithRole('teacher'));
        backToRoleSelect.addEventListener('click', () => {
            loginRoleSelector.style.display = 'flex';
            loginFormContainer.style.display = 'none';
            formError.textContent = '';
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const account = document.getElementById('account').value.trim();
            const password = document.getElementById('password').value;

            const result = validateLogin(username, account, password);

            if (result.success) {
                if (result.isDefault) {
                    handleLogin(result.role, username, account);
                }
            } else if (result.needApi) {
                await handleApiLogin(account, password);
            } else {
                formError.textContent = result.message;
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && loginModalOverlay.classList.contains('active')) {
                closeLoginModalFn();
            }
        });
    </script>
